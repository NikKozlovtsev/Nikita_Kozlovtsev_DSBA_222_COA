syntax = "proto3";
package stats;



message PostId { string postId = 1; }
message UserId { string userId = 1; }
message DateCount { string day = 1; int64 count = 2; }

message Totals {
  int64 views    = 1;
  int64 likes    = 2;
  int64 comments = 3;
}

message TimeSeries {
  repeated DateCount data = 1;
}

message TopRequest {
  enum Metric {
    VIEWS    = 0;
    LIKES    = 1;
    COMMENTS = 2;
  }
  Metric metric = 1;
}

message TopPosts { repeated PostId postIds = 1; }
message TopUsers { repeated UserId userIds = 1; }

service StatsService {
  rpc GetTotals(PostId)              returns (Totals);
  rpc GetViewsTimeSeries(PostId)     returns (TimeSeries);
  rpc GetLikesTimeSeries(PostId)     returns (TimeSeries);
  rpc GetCommentsTimeSeries(PostId)  returns (TimeSeries);
  rpc GetTopPosts(TopRequest)        returns (TopPosts);
  rpc GetTopUsers(TopRequest)        returns (TopUsers);
}