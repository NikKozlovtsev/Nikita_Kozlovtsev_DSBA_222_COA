version: "3.9"

networks:
  app_net:
    driver: bridge

volumes:
  pg_users_data:
  clickhouse_data:
  kafka_data:
  zookeeper_data:

services:
# ───────── ZooKeeper ─────────
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: zookeeper
    restart: unless-stopped
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]

# ───────── Kafka ─────────
  kafka:
    image: bitnami/kafka:3.6
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - 'KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT'
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      # Скрипт возвращает 0, когда брокер реально принимает коннекты
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /opt/bitnami/kafka/config/producer.properties > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [app_net]

# ───────── Kafdrop ─────────
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms32M -Xmx128M
    networks: [app_net]

# ───────── PostgreSQL ─────────
  db_users:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app_net]

# ───────── User service ─────────
  user_service:
    build: ./user_service
    container_name: user_service
    depends_on:
      db_users:
        condition: service_healthy
    ports:
      - "5001:5001"
    networks: [app_net]

# ───────── Post service ─────────
  post_service:
    build: ./post_service
    container_name: post_service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "50051:50051"
    networks: [app_net]

# ───────── API Gateway ─────────
  api_service:
    build: ./api_service
    container_name: api_service
    restart: on-failure
    depends_on:
      user_service:
        condition: service_started
      post_service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      USER_SERVICE_URL: http://user_service:5001
      POST_SERVICE_HOST: post_service:50051
      JWT_SECRET: super-secret-key
    ports:
      - "3000:3000"
    networks: [app_net]

# ───────── ClickHouse ─────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.5
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"           # HTTP-API наружу
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d
    networks: [app_net]

# ───────── Stats service ─────────
  stats_service:
    build: ./stats_service
    container_name: stats_service
    depends_on:
      clickhouse:
        condition: service_started   # ClickHouse быстро слушает порт; healthcheck обычно не нужен
      kafka:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000          # внутренний native-порт
    ports:
      - "50052:50052"
    networks: [app_net]