version: '3.8'
services:
  db_users:
    image: postgres:13
    container_name: db_users
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersdb
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost" ]
      interval: 5s
      timeout: 2s
      retries: 5

  user_service:
    build: ./user_service
    container_name: user_service
    depends_on:
      db_users:
        condition: service_healthy
    ports:
      - "5001:5001"
  post_service:
    build: ./post_service
    container_name: post_service
    ports:
      - "50051:50051"

  api_service:
    build: ./api_service
    container_name: api_service
    depends_on:
      - user_service
      - post_service
    environment:
      - USER_SERVICE_URL=http://user_service:5001
      - POST_SERVICE_HOST=post_service:50051
      - JWT_SECRET=super-secret-key
    ports:
      - "3000:3000"